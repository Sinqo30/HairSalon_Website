<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us | Ntobeko Beauty Studio</title>
  <link rel="stylesheet" href="Styling/homepage.css" />
</head>
<body>

  <header class="header">
    <h1>Contact Us</h1>
    <p>We’d love to hear from you — reach out or visit our studio!</p>
  </header>

  <main class="content">
    <h2>Get in Touch</h2>
    <p>Email: <a href="mailto:percypmmamoe@gmail.com">percypmmamoe@gmail.com</a></p>
    <p>Phone: 071 234 5678</p>
    <p>Address: No 10 Wessels Rd, Rivonia, Sandton</p>

    <h2>Send a Message</h2>
    <form>
      <label for="name">Name:</label><br />
      <input type="text" id="name" required /><br /><br />

      <label for="email">Email:</label><br />
      <input type="email" id="email" required /><br /><br />

      <label for="message">Message:</label><br />
      <textarea id="message" rows="5" required></textarea><br /><br />

      <button type="submit"><h3>Send</h3></button>
    </form>
  </main>

</body>
</html>
