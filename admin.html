<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Ntobeko Beauty Studio</title>
<link rel="stylesheet" href="admin.css">
<script defer src="admin.js"></script>
</head>
<body>

<header>
  <h1>Admin Dashboard</h1>
</header>

<div class="dashboard-container">

  <!-- BOOKINGS TABLE -->
  <div class="dashboard-section">
    <h2>Bookings</h2>
    <table id="bookingsTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Service</th>
          <th>Date</th>
          <th>Time</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- BLOCK FORM -->
  <div class="dashboard-section">
    <h2>Block Dates/Times</h2>

    <form id="blockForm">
      <label>Date:</label>
      <input type="date" id="blockDate" required>

      <label>Time (optional):</label>
      <select id="blockTime">
        <option value="">-- All Day --</option>
        <!-- Times auto-generated by JS -->
      </select>

      <button type="submit">Block</button>
    </form>

    <h3>Blocked Dates/Times</h3>
    <table id="blockedTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Date</th>
          <th>Time</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- LOGOUT -->
  <button id="logoutBtn" class="logout-btn">Logout</button>

</div>

</body>
</html>
