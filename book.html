<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</head>
<body>

<header>
  <h1>Ntobeko Beauty Studio</h1>
  <nav>
    <a href="index.html">Home</a>

    <a href="contact.html">Contact</a>
    <a href="https://www.instagram.com/hairbypercy/" target="_blank" aria-label="Instagram">

    </a>
    <a href="https://wa.me/2782216006"  target="_blank" aria-label="WhatsApp">
      <ion-icon name="logo-whatsapp"></ion-icon>
    </a>
  </nav>
</header>

<div class="main">
  <center><h1 class="title">Book an Appointment</h1></center>

  <section class="booking-form">
    <h2>Schedule Your Visit</h2>
    <form id="bookingForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>
      
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
      
      <label for="service">Select Service</label>
      <select id="service" name="service" required>
        <option value="">-- Choose a service --</option>
        <option value="Hair Styling">Hair Styling</option>
        <option value="Hair Coloring">Hair Coloring</option>
        <option value="Braiding & Protective Styles">Braiding & Protective Styles</option>
        <option value="Extensions">Hair Extensions</option>
        <option value="Special Occasion Styling">Special Occasion Styling</option>
      </select>
      
      <label for="date">Select Date</label>
      <input type="date" id="date" name="date" required>
      
      <label for="time">Select Time</label>
      <select id="time" name="time" required>
        <option value="">-- Select Time --</option>
      </select>
      
      <button type="submit">Book Appointment</button>
      <p id="statusMessage"></p>
    </form>
  </section>
</div>
