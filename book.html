<script defer src="booking.js"></script>


<script>

document.addEventListener("DOMContentLoaded", () => {
  const dateInput = document.getElementById("date");
  const timeSelect = document.getElementById("time");

  // Prevent Sunday bookings
  dateInput.addEventListener("change", () => {
    const date = new Date(dateInput.value + "T00:00:00");
    if (date.getDay() === 0) {
      alert("Ntobeko Beauty Studio is closed on Sundays.");
      dateInput.value = "";
    }
  });

  // Populate time dropdown (07:00 – 19:00 SAST)
  timeSelect.innerHTML = '<option value="">-- Select Time --</option>';

  for (let hour = 7; hour <= 19; hour++) {
    const time = hour.toString().padStart(2, "0") + ":00";
    const option = document.createElement("option");
    option.value = time;
    option.textContent = time;
    timeSelect.appendChild(option);
  }
});
</script>

<div class="main">
  <center><h1 class="title">Book an Appointment</h1></center>

  <section class="booking-form">
    <h2>Schedule Your Visit</h2>

    <form id="bookingForm">

      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="service">Select Service</label>
      <select id="service" name="service" required>
        <option value="">-- Choose a service --</option>

        <option value="Carrot">Carrot</option>
        <option value="Sew in Weave">Sew in Weave</option>
        <option value="Wig">Wig</option>
        <option value="Kid Cornrows">Kid Cornrows</option>
        <option value="Kid Braids">Kid Braids</option>
        <option value="Goddess">Goddess</option>
        <option value="Knotless Braids">Knotless Braids</option>
        <option value="Bhohoman Braids">Bhohoman Braids</option>
        <option value="Passion Twist">Passion Twist</option>
        <option value="Treatment">Treatment</option>
        <option value="Mizani Treatment">Mizani Treatment</option>
        <option value="Wig Lines">Wig Lines</option>
        <option value="Relaxer Dark & Lovely">Relaxer Dark & Lovely</option>
      </select>

      <label for="date">Select Date</label>
      <input type="date" id="date" name="date" required>

      <label for="time">Select Time</label>
      <select id="time" name="time" required></select>

      <button type="submit">Book Appointment</button>
      <p id="statusMessage"></p>
    </form>
  </section>
